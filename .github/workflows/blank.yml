name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Find project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f UsarBrowser.zip ]; then
            unzip -q -o UsarBrowser.zip -d unpacked
            echo "PROJECT_DIR=unpacked/UsarBrowser" >> "$GITHUB_ENV"
          else
            echo "Neither settings.gradle.kts nor UsarBrowser.zip was found in the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace -Pusar.googleWebClientId="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Usar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
