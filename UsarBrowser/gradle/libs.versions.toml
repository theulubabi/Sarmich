navigation = "2.8.1"
room = "2.6.1"
datastore = "1.1.1"
webkit = "1.12.1"
swiperefresh = "1.1.0"
coroutines = "1.8.1"
zxingEmbedded = "4.3.0"
credentials = "1.3.0"
googleid = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
